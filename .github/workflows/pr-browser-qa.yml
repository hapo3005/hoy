name: HOY PR Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoy-pr-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
      CI: 'true'

    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned QA dependency
        run: npm install --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start local HOY server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hoy-pr-server.log 2>&1 &
          echo $! > /tmp/hoy-pr-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hoy-pr-server.log
          exit 1

      - name: Run Mobility smoke QA
        run: npx playwright test tests/mobility-2.31.1.spec.js

      - name: Run full browser QA against PR code
        run: npm run qa:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: hoy-pr-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload QA screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: hoy-pr-qa-screenshots-${{ github.run_id }}
          path: qa-screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure traces and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: hoy-pr-playwright-failures-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
