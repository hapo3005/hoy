name: HOY G2 Wave A Plus3 Review Gate

on:
  pull_request:
    branches:
      - investor-ready/g2-founding-sales-kit-v1

permissions:
  contents: read

jobs:
  review-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Check Wave A +3 review contract
        run: node scripts/investor-ready/check-g2-wave-a-plus3-review.mjs
