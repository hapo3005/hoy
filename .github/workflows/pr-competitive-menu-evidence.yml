name: HOY Competitive Menu Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/competitive-menu-evidence-2.50.spec.js'
      - 'tests/competitive-menu-candidates-2.50.spec.js'
      - 'tests/club-nautico-source-integrity-2.50.spec.js'
      - 'docs/competitive/menu-candidates/**'
      - '.github/workflows/pr-competitive-menu-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoy-competitive-menu-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-first-party-menu-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium with resilient dependency setup
        env:
          PLAYWRIGHT_INSTALL_ATTEMPTS: '2'
          PLAYWRIGHT_INSTALL_TIMEOUT: 6m
        run: bash scripts/install-playwright-browser-resilient.sh chromium
      - name: Validate competitive menu candidate contracts
        run: npx playwright test tests/competitive-menu-candidates-2.50.spec.js tests/club-nautico-source-integrity-2.50.spec.js --project=desktop-chromium --workers=1 --retries=0
      - name: Capture competitive first-party menu candidates only
        run: npx playwright test tests/competitive-menu-evidence-2.50.spec.js --project=desktop-chromium --workers=1 --retries=0
      - name: Upload competitive menu evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-competitive-menu-evidence-${{ github.run_id }}
          path: |
            qa-screenshots/competitive-menus/
            playwright-report/
          retention-days: 30
          if-no-files-found: error
