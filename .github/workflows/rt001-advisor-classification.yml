name: RT-001 Advisor Classification Gate

on:
  pull_request:
    branches:
      - security/rt001-isolated-postgres-proof-v1

permissions:
  contents: read

jobs:
  advisor-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Check RT-001 advisor classification
        run: node scripts/investor-ready/check-rt001-advisor-classification.mjs
