name: Investor Ready RT-005 Secret History Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/investor-ready-rt005-secret-history-audit.yml'
      - 'docs/investor-ready/rt005-digital-asset-control.md'
      - 'docs/investor-ready/rt005-secret-findings-classification.json'
      - 'docs/investor-ready/rt005-secret-history-evidence.md'
      - 'docs/investor-ready/rt005-control-register.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history-audit:
    name: All-history secret census
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a

    steps:
      - name: Checkout exact audit controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit-controls
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout HOY Core/Gastro full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy
          ref: main
          path: hoy
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout HOY Lifestyle full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy-lifestyle
          ref: main
          path: hoy-lifestyle
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout HOY Works full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy-works
          ref: main
          path: hoy-works
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch every advertised branch and tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p investor-ready-secret-audit
          for repo in hoy hoy-lifestyle hoy-works; do
            git -C "$repo" fetch origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              --force --prune
            mkdir -p "investor-ready-secret-audit/$repo"
            git -C "$repo" for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags \
              | sort -u > "investor-ready-secret-audit/$repo/refs.txt"
          done

      - name: Prove scanner health with runtime-only canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-canary
          p1='fmq9UXkjXpSqD7UoGgqR'
          p2='hhntoI3sL0z9Cs6RlVnn'
          printf 'token = "%s%s"\n' "$p1" "$p2" > secret-canary/canary.txt
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE/secret-canary:/scan:ro" \
            -v "$GITHUB_WORKSPACE:/out" \
            "$GITLEAKS_IMAGE" \
            dir --no-banner --no-color --redact=100 \
            --report-format=json --report-path=/out/canary-report.json /scan
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::Gitleaks canary expected exit 1, got $rc"
            exit 20
          fi
          python3 <<'PY'
          import json
          rows=json.load(open('canary-report.json',encoding='utf-8'))
          if not rows or not any(x.get('RuleID')=='generic-api-key' for x in rows):
              raise SystemExit('Canary did not prove generic-api-key detector health')
          print(f'Canary detector health PASS: {len(rows)} finding(s)')
          PY
          rm -rf secret-canary canary-report.json

      - name: Scan reachable Git history and sanitize reports
        shell: bash
        run: |
          set -euo pipefail
          scan_repo() {
            local repo="$1"
            local out="$GITHUB_WORKSPACE/investor-ready-secret-audit/$repo"
            local raw="$GITHUB_WORKSPACE/${repo}-gitleaks-raw.json"
            set +e
            docker run --rm \
              -v "$GITHUB_WORKSPACE/$repo:/repo:ro" \
              -v "$GITHUB_WORKSPACE:/out" \
              "$GITLEAKS_IMAGE" \
              git --no-banner --no-color --redact=100 \
              --log-opts='--all --full-history' \
              --report-format=json --report-path="/out/${repo}-gitleaks-raw.json" /repo
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
              echo "::error::$repo scanner failed with exit $rc"
              exit "$rc"
            fi
            python3 - "$repo" "$raw" "$out" "$rc" <<'PY'
          import json, os, sys
          repo, raw, out, rc=sys.argv[1],sys.argv[2],sys.argv[3],int(sys.argv[4])
          os.makedirs(out,exist_ok=True)
          try: data=json.load(open(raw,encoding='utf-8'))
          except FileNotFoundError: data=[]
          safe=[]
          for x in data:
              safe.append({
                  'rule_id':x.get('RuleID'),'description':x.get('Description'),
                  'file':x.get('File'),'commit':x.get('Commit'),
                  'start_line':x.get('StartLine'),'end_line':x.get('EndLine'),
                  'author':x.get('Author'),'email':x.get('Email'),'date':x.get('Date'),
                  'message':x.get('Message'),'fingerprint':x.get('Fingerprint'),
                  'tags':x.get('Tags') or []
              })
          json.dump(safe,open(os.path.join(out,'findings-sanitized.json'),'w',encoding='utf-8'),indent=2,ensure_ascii=False)
          summary={
              'repository':repo,'scanner_exit_code':rc,'finding_count':len(safe),
              'unique_rules':sorted({str(x.get('rule_id')) for x in safe}),
              'unique_commits':len({x.get('commit') for x in safe if x.get('commit')}),
              'raw_report_retained':False,'secret_values_retained':False
          }
          json.dump(summary,open(os.path.join(out,'summary.json'),'w',encoding='utf-8'),indent=2)
          print(json.dumps(summary))
          PY
            rm -f "$raw"
          }
          scan_repo hoy
          scan_repo hoy-lifestyle
          scan_repo hoy-works

      - name: Classify exact findings and fail closed by default
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib
          root=pathlib.Path('investor-ready-secret-audit')
          manifest=json.loads(pathlib.Path('audit-controls/docs/investor-ready/rt005-secret-findings-classification.json').read_text(encoding='utf-8'))
          allowed={(x['repository'],x['fingerprint']):x for x in manifest['classifications']}
          findings=[]
          for path in sorted(root.glob('*/findings-sanitized.json')):
              repo=path.parent.name
              rows=json.loads(path.read_text(encoding='utf-8'))
              classified=[]
              for row in rows:
                  rec=dict(row)
                  match=allowed.get((repo,row.get('fingerprint')))
                  if match:
                      rec['classification']=match['classification']
                      rec['rationale']=match['rationale']
                  else:
                      rec['classification']='REVIEW_REQUIRED'
                      rec['rationale']='No exact reviewed fingerprint classification exists.'
                  classified.append(rec)
                  findings.append((repo,rec))
              path.write_text(json.dumps(classified,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          current={(repo,r.get('fingerprint')) for repo,r in findings}
          stale=sorted(set(allowed)-current)
          unclassified=[(repo,r) for repo,r in findings if r['classification']=='REVIEW_REQUIRED']
          by_class={}
          for _,r in findings:
              if r['classification']!='REVIEW_REQUIRED':
                  by_class[r['classification']]=by_class.get(r['classification'],0)+1
          result={
              'total_findings':len(findings),
              'classified_findings':len(findings)-len(unclassified),
              'unclassified_findings':len(unclassified),
              'class_counts':by_class,
              'stale_classification_entries':len(stale),
              'status':'GREEN' if not unclassified else 'REVIEW_REQUIRED'
          }
          (root/'classification-summary.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          if unclassified:
              print('Unclassified fingerprints:')
              for repo,r in unclassified: print(repo,r.get('fingerprint'),r.get('rule_id'))
          PY

      - name: Build sanitized DD summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib
          root=pathlib.Path('investor-ready-secret-audit')
          rows=[json.loads(p.read_text(encoding='utf-8')) for p in sorted(root.glob('*/summary.json'))]
          cpath=root/'classification-summary.json'
          classification=json.loads(cpath.read_text(encoding='utf-8')) if cpath.exists() else None
          lines=['# HOY RT-005 Secret History Audit','',
                 'Scope: Git objects reachable from every branch/tag advertised by the three origins at workflow runtime.',
                 'Artifact is sanitized; detected secret values and source-line match text are not retained.','',
                 '| Repository | Findings | Rules | Commits |','|---|---:|---|---:|']
          for x in rows:
              rules=', '.join(x['unique_rules']) if x['unique_rules'] else '—'
              lines.append(f"| {x['repository']} | {x['finding_count']} | {rules} | {x['unique_commits']} |")
          if classification:
              lines += ['',f"Unclassified findings: **{classification['unclassified_findings']}**",
                        f"Technical gate: **{classification['status']}**"]
          else:
              lines += ['','Classification result unavailable: **FAIL-CLOSED**']
          lines += ['','A finding is not automatically a confirmed credential leak; every accepted finding requires an exact reviewed fingerprint classification.',
                    'Scope limitation: unreachable Git objects and non-Git systems are outside this scan.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload sanitized RT-005 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoy-rt005-secret-history-audit
          path: investor-ready-secret-audit/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce zero unclassified findings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          x=json.load(open('investor-ready-secret-audit/classification-summary.json'))
          if x['unclassified_findings'] != 0:
              raise SystemExit(f"RT-005 FAIL: {x['unclassified_findings']} unclassified finding(s)")
          print('RT-005 secret-history gate GREEN: zero unclassified findings')
          PY
