name: Investor Ready RT-005 Secret History Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/investor-ready-rt005-secret-history-audit.yml'
      - 'docs/investor-ready/rt005-digital-asset-control.md'
      - 'docs/investor-ready/rt006-oss-sbom-ai.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history-audit:
    name: All-history secret census
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # v8.30.1 has a reported rule-matching regression. Pin a known prior image
      # by immutable multi-arch digest and prove detector health with a canary first.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a

    steps:
      - name: Checkout HOY Core/Gastro full history
        uses: actions/checkout@v6
        with:
          repository: hapo3005/hoy
          ref: main
          path: hoy
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout HOY Lifestyle full history
        uses: actions/checkout@v6
        with:
          repository: hapo3005/hoy-lifestyle
          ref: main
          path: hoy-lifestyle
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout HOY Works full history
        uses: actions/checkout@v6
        with:
          repository: hapo3005/hoy-works
          ref: main
          path: hoy-works
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch every currently advertised branch and tag
        shell: bash
        run: |
          set -euo pipefail
          for repo in hoy hoy-lifestyle hoy-works; do
            git -C "$repo" fetch origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              --force --prune
            mkdir -p "investor-ready-secret-audit/$repo"
            git -C "$repo" for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags \
              | sort -u > "investor-ready-secret-audit/$repo/refs.txt"
          done

      - name: Prove scanner health with synthetic canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-canary
          # Deliberately fake/nonfunctional PAT-shaped token. Never use a real credential here.
          printf '%s\n' 'token = "ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"' > secret-canary/canary.txt

          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE/secret-canary:/scan:ro" \
            -v "$GITHUB_WORKSPACE:/out" \
            "$GITLEAKS_IMAGE" \
            dir --no-banner --no-color --redact=100 \
            --report-format=json --report-path=/out/canary-report.json /scan
          rc=$?
          set -e

          if [ "$rc" -ne 1 ]; then
            echo "::error::Gitleaks canary did not produce expected leak exit code 1 (got $rc). Refusing to trust scan."
            exit 20
          fi

          python3 <<'PY'
          import json
          rows = json.load(open('canary-report.json', encoding='utf-8'))
          if not rows:
              raise SystemExit('Canary report is empty; refusing to trust scanner')
          print(f'Canary detector health: PASS ({len(rows)} synthetic finding(s))')
          PY
          rm -rf secret-canary canary-report.json

      - name: Scan all reachable Git history
        shell: bash
        run: |
          set -euo pipefail

          scan_repo() {
            local repo="$1"
            local out="$GITHUB_WORKSPACE/investor-ready-secret-audit/$repo"
            local raw="$GITHUB_WORKSPACE/${repo}-gitleaks-raw.json"

            set +e
            docker run --rm \
              -v "$GITHUB_WORKSPACE/$repo:/repo:ro" \
              -v "$GITHUB_WORKSPACE:/out" \
              "$GITLEAKS_IMAGE" \
              git --no-banner --no-color --redact=100 \
              --log-opts='--all --full-history' \
              --report-format=json --report-path="/out/${repo}-gitleaks-raw.json" /repo
            rc=$?
            set -e

            # Gitleaks: 0 = none, 1 = findings. Any other status is a scanner failure.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
              echo "::error::$repo scanner failed with exit code $rc"
              exit "$rc"
            fi

            python3 - "$repo" "$raw" "$out" "$rc" <<'PY'
          import hashlib, json, os, sys
          repo, raw, out, rc = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
          os.makedirs(out, exist_ok=True)
          try:
              data = json.load(open(raw, encoding='utf-8'))
          except FileNotFoundError:
              data = []

          safe = []
          for x in data:
              # Intentionally exclude Secret, Match and source Line from DD artifacts.
              safe.append({
                  'rule_id': x.get('RuleID'),
                  'description': x.get('Description'),
                  'file': x.get('File'),
                  'commit': x.get('Commit'),
                  'start_line': x.get('StartLine'),
                  'end_line': x.get('EndLine'),
                  'author': x.get('Author'),
                  'email': x.get('Email'),
                  'date': x.get('Date'),
                  'message': x.get('Message'),
                  'fingerprint': x.get('Fingerprint'),
                  'tags': x.get('Tags') or [],
              })

          report = os.path.join(out, 'findings-sanitized.json')
          with open(report, 'w', encoding='utf-8') as f:
              json.dump(safe, f, indent=2, ensure_ascii=False)

          summary = {
              'repository': repo,
              'scanner_exit_code': rc,
              'finding_count': len(safe),
              'unique_rules': sorted({str(x.get('rule_id')) for x in safe}),
              'unique_commits': len({x.get('commit') for x in safe if x.get('commit')}),
              'status': 'REVIEW_REQUIRED' if safe else 'NO_FINDINGS',
              'raw_report_retained': False,
              'secret_values_retained': False,
          }
          with open(os.path.join(out, 'summary.json'), 'w', encoding='utf-8') as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary))
          PY

            # Never retain the raw report because it may contain credential material.
            rm -f "$raw"
          }

          scan_repo hoy
          scan_repo hoy-lifestyle
          scan_repo hoy-works

      - name: Build DD summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib
          root = pathlib.Path('investor-ready-secret-audit')
          rows = []
          for p in sorted(root.glob('*/summary.json')):
              rows.append(json.loads(p.read_text(encoding='utf-8')))

          lines = [
              '# HOY RT-005 Secret History Audit', '',
              'Scope: all commits reachable from every branch/tag fetched from each GitHub origin at workflow runtime.',
              'Reports are sanitized: no detected secret value, match text or source line content is retained in the artifact.', '',
              '| Repository | Findings | Rules | Commits | Status |',
              '|---|---:|---|---:|---|',
          ]
          total = 0
          for x in rows:
              total += x['finding_count']
              rules = ', '.join(x['unique_rules']) if x['unique_rules'] else '—'
              lines.append(f"| {x['repository']} | {x['finding_count']} | {rules} | {x['unique_commits']} | {x['status']} |")
          lines += ['', f'**Total scanner findings requiring classification: {total}**', '']
          if total:
              lines.append('Finding != confirmed credential leak. Each sanitized finding must be classified before RT-005 can close.')
          else:
              lines.append('No detector finding was produced in the current reachable history of the three repositories.')
          lines += ['', 'Scope limitation: objects no longer reachable from any advertised remote ref cannot be enumerated by a fresh remote clone.']
          (root / 'SUMMARY.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload sanitized RT-005 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoy-rt005-secret-history-audit
          path: investor-ready-secret-audit/
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed on findings
        shell: bash
        run: |
          set -euo pipefail
          count="$(python3 - <<'PY'
          import json, pathlib
          print(sum(json.loads(p.read_text())['finding_count'] for p in pathlib.Path('investor-ready-secret-audit').glob('*/summary.json')))
          PY
          )"
          if [ "$count" -ne 0 ]; then
            echo "RT-005 requires classification/remediation of $count sanitized scanner finding(s)."
            exit 1
          fi
          echo "RT-005 all-history secret scan produced zero findings."
