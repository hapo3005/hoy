name: RT-006 Supply Chain Hardening

on:
  push:
    branches:
      - security/rt006-supply-chain-hardening
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/investor-ready/rt006-supply-chain-evidence.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/investor-ready/rt006-supply-chain-evidence.md'

permissions:
  contents: write

jobs:
  harden:
    name: Lock QA graph and pin Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npm --version)" >> "$GITHUB_OUTPUT"

      - name: Generate reproducible QA lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          test -s package-lock.json
          npm ls --all --json > /tmp/rt006-npm-tree.json

      - name: Resolve and pin every external GitHub Action to an immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib, re, urllib.error, urllib.parse, urllib.request

          root = pathlib.Path('.github/workflows')
          token = os.environ.get('GH_TOKEN', '')
          api = 'https://api.github.com'
          sha_re = re.compile(r'^[0-9a-fA-F]{40}$')
          uses_re = re.compile(r'^(?P<prefix>\s*(?:-\s*)?uses:\s*)(?P<quote>[\"\']?)(?P<target>[^\"\'\s#]+)@(?P<ref>[^\"\'\s#]+)(?P=quote)(?P<trail>\s*(?:#.*)?)$')

          def get_json(path):
              req = urllib.request.Request(
                  api + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      **({'Authorization': f'Bearer {token}'} if token else {}),
                      'User-Agent': 'HOY-RT006-Supply-Chain-Audit',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def resolve(owner, repo, ref):
              enc = urllib.parse.quote(ref, safe='')
              try:
                  data = get_json(f'/repos/{owner}/{repo}/git/ref/tags/{enc}')
                  obj = data['object']
                  while obj.get('type') == 'tag':
                      obj = get_json(f"/repos/{owner}/{repo}/git/tags/{obj['sha']}")['object']
                  if obj.get('type') == 'commit' and sha_re.fullmatch(obj['sha']):
                      return obj['sha']
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              data = get_json(f'/repos/{owner}/{repo}/commits/{enc}')
              sha = data['sha']
              if not sha_re.fullmatch(sha):
                  raise RuntimeError(f'Could not resolve immutable SHA for {owner}/{repo}@{ref}')
              return sha

          mapping = {}
          unresolved = []
          changed_files = []

          for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
              old = path.read_text(encoding='utf-8')
              out = []
              changed = False
              for line in old.splitlines():
                  m = uses_re.match(line)
                  if not m:
                      out.append(line)
                      continue
                  target, ref = m.group('target'), m.group('ref')
                  if target.startswith('./') or target.startswith('docker://'):
                      out.append(line)
                      continue
                  parts = target.split('/')
                  if len(parts) < 2:
                      unresolved.append(f'{path}: malformed external action {target}@{ref}')
                      out.append(line)
                      continue
                  if sha_re.fullmatch(ref):
                      out.append(line)
                      continue
                  owner, repo = parts[0], parts[1]
                  sha = resolve(owner, repo, ref)
                  mapping[f'{owner}/{repo}@{ref}'] = sha
                  old_comment = m.group('trail').strip()
                  if old_comment.startswith('#'):
                      old_comment = old_comment[1:].strip()
                  comment = f'# {ref}' + (f' | {old_comment}' if old_comment else '')
                  newline = f"{m.group('prefix')}{m.group('quote')}{target}@{sha}{m.group('quote')} {comment}"
                  out.append(newline)
                  changed = changed or newline != line
              new = '\n'.join(out) + ('\n' if old.endswith('\n') else '')
              if changed:
                  path.write_text(new, encoding='utf-8')
                  changed_files.append(str(path))

          if unresolved:
              raise SystemExit('\n'.join(unresolved))

          # Fail closed: every external uses reference in the resulting workflow set must be a 40-char SHA.
          failures = []
          for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  m = uses_re.match(line)
                  if not m:
                      continue
                  target, ref = m.group('target'), m.group('ref')
                  if target.startswith('./') or target.startswith('docker://'):
                      continue
                  if not sha_re.fullmatch(ref):
                      failures.append(f'{path}:{n}: {target}@{ref}')
          if failures:
              raise SystemExit('Unpinned external Actions remain:\n' + '\n'.join(failures))

          pathlib.Path('/tmp/rt006-action-mapping.json').write_text(
              json.dumps(mapping, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('/tmp/rt006-action-files.txt').write_text(
              '\n'.join(changed_files) + ('\n' if changed_files else ''), encoding='utf-8'
          )
          print(f'Pinned {len(mapping)} unique action tag/ref mapping(s) across {len(changed_files)} workflow file(s).')
          PY

      - name: Write sanitized RT-006 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/investor-ready
          lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          action_count="$(python3 - <<'PY'
          import json
          print(len(json.load(open('/tmp/rt006-action-mapping.json'))))
          PY
          )"
          workflow_count="$(wc -l < /tmp/rt006-action-files.txt | tr -d ' ')"
          {
            echo '# RT-006 — Supply-Chain Hardening Evidence'
            echo
            echo 'Status: **candidate generated; no Production deploy; no merge authorized**'
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Node: \`${{ steps.toolchain.outputs.node }}\`"
            echo "- npm: \`${{ steps.toolchain.outputs.npm }}\`"
            echo "- package-lock SHA-256: \`${lock_sha}\`"
            echo "- Unique external Action refs resolved to immutable SHAs: **${action_count}**"
            echo "- Workflow files changed by pinning: **${workflow_count}**"
            echo
            echo '## Action pin map'
            echo
            echo '| Mutable ref | Immutable commit SHA |'
            echo '|---|---|'
            python3 - <<'PY'
          import json
          for ref, sha in sorted(json.load(open('/tmp/rt006-action-mapping.json')).items()):
              print(f'| `{ref}` | `{sha}` |')
          PY
            echo
            echo '## Close conditions'
            echo
            echo '- `package-lock.json` is committed and `npm ci --ignore-scripts` succeeds.'
            echo '- Every external `uses:` reference in `.github/workflows` is a 40-character immutable commit SHA.'
            echo '- Repository QA passes on the hardened branch.'
            echo '- A final release-candidate SBOM is regenerated after all approved RT-006 changes are combined.'
          } > docs/investor-ready/rt006-supply-chain-evidence.md

      - name: Verify hardening invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --ignore-scripts
          python3 <<'PY'
          import pathlib, re
          sha = re.compile(r'^[0-9a-fA-F]{40}$')
          pat = re.compile(r'\buses:\s*[\"\']?([^\"\'\s#]+)@([^\"\'\s#]+)')
          bad=[]
          for p in sorted(list(pathlib.Path('.github/workflows').glob('*.yml')) + list(pathlib.Path('.github/workflows').glob('*.yaml'))):
              for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  m=pat.search(line)
                  if not m: continue
                  target,ref=m.group(1),m.group(2)
                  if target.startswith('./') or target.startswith('docker://'): continue
                  if not sha.fullmatch(ref): bad.append(f'{p}:{n}: {target}@{ref}')
          if bad: raise SystemExit('Mutable external Action refs remain:\n'+'\n'.join(bad))
          print('All external GitHub Actions are immutable-SHA pinned.')
          PY

      - name: Commit candidate hardening to branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json .github/workflows docs/investor-ready/rt006-supply-chain-evidence.md; then
            echo 'No supply-chain hardening changes required.'
            exit 0
          fi
          git config user.name 'HOY RT-006 Supply Chain'
          git config user.email 'actions@users.noreply.github.com'
          git add -- package-lock.json .github/workflows docs/investor-ready/rt006-supply-chain-evidence.md
          git commit -m 'Harden RT-006 supply chain and lock QA dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}
