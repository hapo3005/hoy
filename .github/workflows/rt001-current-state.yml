name: RT-001 Current-State Gate

on:
  pull_request:
    paths:
      - 'supabase/release/rt001-security-hardening-current-97.sql'
      - 'supabase/release/rt001-security-hardening-current-97-audit.sql'
      - 'supabase/release/rt001-security-hardening-current-97.json'
      - 'tests/rt001-security-hardening-current-97.spec.js'
      - 'docs/investor-ready/rt001-security-hardening-current-97.md'
      - '.github/workflows/rt001-current-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rt001-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts
      - name: Run RT-001 97-migration contract
        run: npx playwright test tests/rt001-security-hardening-current-97.spec.js --project=desktop-chromium --workers=1
