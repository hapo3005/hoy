name: HOY ACQ-06 Region Replication Gate

on:
  pull_request:
    branches:
      - investor-ready/acq05-merchant-confirmation-v1

permissions:
  contents: read

jobs:
  region-replication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/investor-ready/check-acq06-region-replication.mjs
          node --check tests/acq06-region-replication.spec.js
      - name: Run fail-closed ACQ-06 contract
        run: node scripts/investor-ready/check-acq06-region-replication.mjs
      - name: Run ACQ-06 tests
        run: node tests/acq06-region-replication.spec.js
