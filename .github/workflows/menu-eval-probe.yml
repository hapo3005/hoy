name: HOY Menu Eval Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/menu-eval-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.HOY_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.HOY_SUPABASE_SECRET_KEY }}
    steps:
      - name: Verify secret presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in OPENAI_API_KEY SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret mapping: $key"
              missing=1
            else
              echo "$key=present"
            fi
          done
          test "$missing" -eq 0

      - name: Verify OpenAI project model access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models \
            -o /tmp/models.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/models.json','utf8'));
          const ids=(body.data||[]).map(x=>x.id).filter(Boolean).sort();
          const relevant=ids.filter(id=>/^(gpt-5|o3|o4)/i.test(id));
          console.log('Relevant OpenAI models available to this project:');
          for(const id of relevant) console.log(`- ${id}`);
          if(!relevant.length) process.exitCode=4;
          NODE

      - name: Verify HOY gold corpus access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Accept: application/json" \
            "$SUPABASE_URL/rest/v1/menu_eval_cases?select=id,expected_item_count&is_active=eq.true" \
            -o /tmp/cases.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/cases.json','utf8'));
          const total=rows.reduce((s,x)=>s+(Number(x.expected_item_count)||0),0);
          console.log(`Active HOY gold cases: ${rows.length}`);
          console.log(`Expected menu items: ${total}`);
          if(rows.length!==10 || total<300) process.exitCode=5;
          NODE
