name: HOY Menu Data Gap Backfill

on:
  push:
    branches:
      - agent/hoy-native-trilingual-menu-standard
    paths:
      - '.github/hoy-menu-data-gap-trigger.json'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: https://zlscptisdxzxuvllogza.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.HOY_SUPABASE_SECRET_KEY }}
      OPENAI_MENU_REASONING_EFFORT: high
      HOY_MENU_LOCALIZATION_BATCH_SIZE: '40'
      HOY_MENU_LOCALIZATION_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is missing'; exit 2; }
          test -n "$SUPABASE_SECRET_KEY" || { echo '::error::HOY_SUPABASE_SECRET_KEY is missing'; exit 2; }

      - name: Verify trigger authorizes Production backfill
        shell: bash
        run: |
          node - <<'NODE'
          const x=require('./.github/hoy-menu-data-gap-trigger.json');
          if(x.production_apply!==true) throw new Error('production_apply must be true');
          if(x.scope!=='menu_structure_and_de_es_en_localization') throw new Error('unexpected backfill scope');
          console.log('Production backfill trigger accepted:', x.requested_at);
          NODE

      - name: Syntax-check guarded backfill scripts
        shell: bash
        run: |
          node --check scripts/menu-structure-gap-backfill.mjs
          node --check scripts/menu-localization-backfill.mjs

      - name: Close zero-item trusted core source gaps
        shell: bash
        run: node scripts/menu-structure-gap-backfill.mjs --apply

      - name: Close DE ES EN localization gaps
        shell: bash
        run: node scripts/menu-localization-backfill.mjs --apply

      - name: Upload immutable backfill evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: hoy-menu-data-gap-backfill-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
