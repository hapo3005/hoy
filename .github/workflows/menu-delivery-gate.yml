name: HOY Menu Delivery Gate

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hoy-menu-delivery-gate
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: gate · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-chrome
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    env:
      PLAYWRIGHT_TEST_BASE_URL: https://hapo3005.github.io/hoy/
      CI: 'true'
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pinned QA dependency
        run: npm install --no-audit --no-fund

      - name: Install browser engine
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Verify deployed menu truth
        run: npx playwright test tests/menu-delivery-integrity-2.37.spec.js tests/chibichanga-live-2.36.spec.js --project="${{ matrix.project }}"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-menu-delivery-failure-${{ matrix.project }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: warn
