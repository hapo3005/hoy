name: HOY One-shot Edge SSRF Patch

on:
  push:
    branches: [security/edge-url-ssrf-ipv6-mapped]
    paths:
      - '.github/workflows/edge-ssrf-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: security/edge-url-ssrf-ipv6-mapped
          fetch-depth: 1
      - name: Apply exact IPv4-mapped IPv6 SSRF guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          typed_old = "function private6(h:string){h=h.toLowerCase().replace(/^\\[|\\]$/g,'');return h==='::'||h==='::1'||h.startsWith('fc')||h.startsWith('fd')||/^fe[89ab]/.test(h)}"
          typed_new = "function private6(h:string){h=h.toLowerCase().replace(/^\\[|\\]$/g,'');return h==='::'||h==='::1'||h.startsWith('::ffff:')||h.startsWith('fc')||h.startsWith('fd')||/^fe[89ab]/.test(h)||h.startsWith('ff')||h.startsWith('2001:db8:')}"
          untyped_old = "function private6(h){h=String(h).toLowerCase().replace(/^\\[|\\]$/g,'');return h==='::'||h==='::1'||h.startsWith('fc')||h.startsWith('fd')||/^fe[89ab]/.test(h)}"
          untyped_new = "function private6(h){h=String(h).toLowerCase().replace(/^\\[|\\]$/g,'');return h==='::'||h==='::1'||h.startsWith('::ffff:')||h.startsWith('fc')||h.startsWith('fd')||/^fe[89ab]/.test(h)||h.startsWith('ff')||h.startsWith('2001:db8:')}"

          targets = {
              'supabase/functions/menu-editorial-import/index.ts': (typed_old, typed_new),
              'supabase/functions/menu-discovery/index.ts': (typed_old, typed_new),
              'supabase/functions/menu-social-handoff/index.ts': (typed_old, typed_new),
              'supabase/functions/menu-intake-process/index.ts': (untyped_old, untyped_new),
          }

          for name, (old, new) in targets.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one old private6 implementation, found {count}')
              updated = text.replace(old, new, 1)
              if updated.count("startsWith('::ffff:')") != 1:
                  raise SystemExit(f'{name}: mapped IPv6 guard verification failed')
              path.write_text(updated, encoding='utf-8')
              print(f'patched {name}')
          PY
      - name: Verify patch scope and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            supabase/functions/menu-editorial-import/index.ts \
            supabase/functions/menu-discovery/index.ts \
            supabase/functions/menu-intake-process/index.ts \
            supabase/functions/menu-social-handoff/index.ts; do
            grep -Fq "startsWith('::ffff:')" "$f"
            grep -Fq "private_dns_target" "$f"
          done
          rm .github/workflows/edge-ssrf-patch-once.yml
          git diff --check
      - name: Commit exact security patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HOY Security Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            supabase/functions/menu-editorial-import/index.ts \
            supabase/functions/menu-discovery/index.ts \
            supabase/functions/menu-intake-process/index.ts \
            supabase/functions/menu-social-handoff/index.ts \
            .github/workflows/edge-ssrf-patch-once.yml
          git diff --cached --check
          git commit -m 'Security: block IPv4-mapped IPv6 in Edge URL fetchers'
          git push origin HEAD:security/edge-url-ssrf-ipv6-mapped
