name: RT-006 Supply Chain Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/investor-ready/materialize-rt006-supply-chain.sh'
      - 'docs/investor-ready/rt006-supply-chain-evidence.md'

permissions:
  contents: write

concurrency:
  group: rt006-supply-chain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize lockfile and immutable Action refs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.head_ref }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize RT-006 supply-chain candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/investor-ready/materialize-rt006-supply-chain.sh
          scripts/investor-ready/materialize-rt006-supply-chain.sh

      - name: Upload materialized candidate for controlled GitHub-connector commit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rt006-supply-chain-materialized-${{ github.run_id }}
          path: |
            package-lock.json
            .github/workflows/
            docs/investor-ready/rt006-supply-chain-evidence.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
