name: HOY Menu Browser Discovery

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Discovery scope: core or all'
        required: true
        default: 'core'
        type: choice
        options: [core, all]
      venue_limit:
        description: 'Maximum venues to inspect (1-50)'
        required: true
        default: '14'
  push:
    branches: [main]
    paths:
      - '.github/hoy-menu-discovery-trigger.json'
      - '.github/workflows/menu-browser-discovery.yml'
      - 'scripts/menu-browser-discovery.mjs'
      - 'scripts/menu-browser-focus.mjs'

permissions:
  contents: read

concurrency:
  group: hoy-menu-browser-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium with resilient dependency setup
        env:
          PLAYWRIGHT_INSTALL_ATTEMPTS: '3'
          PLAYWRIGHT_INSTALL_TIMEOUT: 8m
        run: bash scripts/install-playwright-browser-resilient.sh chromium
      - name: Resolve scope
        id: config
        shell: bash
        env:
          DISPATCH_SCOPE: ${{ github.event.inputs.scope }}
          DISPATCH_LIMIT: ${{ github.event.inputs.venue_limit }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            scope=$(node -e "const x=require('./.github/hoy-menu-discovery-trigger.json');process.stdout.write(String(x.scope||'core'))")
            limit=$(node -e "const x=require('./.github/hoy-menu-discovery-trigger.json');process.stdout.write(String(x.limit||14))")
            focus=$(node -e "const x=require('./.github/hoy-menu-discovery-trigger.json');process.stdout.write(Array.isArray(x.focus_ids)&&x.focus_ids.length?'true':'false')")
          else
            scope="${DISPATCH_SCOPE:-core}"
            limit="${DISPATCH_LIMIT:-14}"
            focus="false"
          fi
          case "$scope" in core|all) ;; *) echo '::error::scope must be core or all'; exit 3;; esac
          if ! [[ "$limit" =~ ^[0-9]+$ ]] || [ "$limit" -lt 1 ] || [ "$limit" -gt 50 ]; then echo '::error::venue_limit must be 1-50'; exit 4; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "focus=$focus" >> "$GITHUB_OUTPUT"
      - name: Browse official operator channels
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.focus }}" = "true" ]; then
            node scripts/menu-browser-focus.mjs
          else
            node scripts/menu-browser-discovery.mjs --scope "${{ steps.config.outputs.scope }}" --limit "${{ steps.config.outputs.limit }}"
          fi
      - name: Upload discovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-menu-discovery-${{ github.run_id }}
          path: |
            menu-discovery-report.json
            menu-discovery-summary.json
            menu-discovery-screenshots/
          retention-days: 30
          if-no-files-found: error
