name: RT-006 One-Shot Pin Investor Actions

# One-shot normalization trigger: 2026-08-18T21:46Z
on:
  push:
    branches:
      - ops/rt-005-rt-006-assets-sbom-ai
    paths:
      - '.github/workflows/rt006-one-shot-pin-investor-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ops/rt-005-rt-006-assets-sbom-ai
          fetch-depth: 0
      - name: Replace movable action tags with verified immutable commits
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          replacements={
            'actions/checkout@v6':'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6',
            'actions/setup-node@v6':'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6',
            'actions/upload-artifact@v5':'actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5',
            'actions/upload-artifact@v4':'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4',
          }
          changed=[]
          for p in sorted(Path('.github/workflows').glob('investor-ready-*.yml')):
            old=p.read_text(encoding='utf-8')
            new=old
            for src,dst in replacements.items(): new=new.replace(src,dst)
            if new!=old:
              p.write_text(new,encoding='utf-8')
              changed.append(str(p))
          print('normalized:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit normalization only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/investor-ready-*.yml; then
            echo 'No movable Investor-Ready action tags remain.'
            exit 0
          fi
          git config user.name 'HOY RT-006 Supply Chain Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .github/workflows/investor-ready-*.yml
          git commit -m 'RT-006: pin Investor-Ready workflow actions to immutable SHAs'
          git push origin HEAD:ops/rt-005-rt-006-assets-sbom-ai
