name: HOY Acquisition Thesis Gate

on:
  pull_request:
    paths:
      - 'docs/investor-ready/hoy-acquisition-thesis-v1.md'
      - 'docs/investor-ready/hoy-acquisition-thesis-v1.json'
      - 'scripts/investor-ready/check-hoy-acquisition-thesis.mjs'
      - '.github/workflows/hoy-acquisition-thesis-gate.yml'

permissions:
  contents: read

jobs:
  acquisition-thesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Run fail-closed acquisition thesis contract
        run: node scripts/investor-ready/check-hoy-acquisition-thesis.mjs
