name: RT-008 Edge Region Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'edge-region-policy-2.48.js'
      - 'index.html'
      - 'admin.html'
      - 'service-worker.js'
      - 'tests/edge-region-policy-2.48.spec.js'
      - 'scripts/investor-ready/rt008-edge-region-static-check.mjs'
      - 'docs/investor-ready/rt008-edge-region-policy-2026-08-19.md'
      - 'supabase/functions/**'
      - '.github/workflows/rt008-edge-region.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-region-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify fail-closed Edge execution-region policy
        run: node scripts/investor-ready/rt008-edge-region-static-check.mjs
