name: HOY Final Release QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hoy-final-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Static release integrity
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          test "$(node -p "require('./package.json').version")" = "2.39.0"
          grep -q 'App 2.39.0' index.html
          grep -q 'HOY Control Center · 2.39.0' admin.html
          grep -q '@supabase/supabase-js@2.111.0/dist/umd/supabase.js' index.html
          grep -q '@supabase/supabase-js@2.111.0/dist/umd/supabase.js' admin.html
          grep -q "const CACHE='hoy-v2.39.0'" service-worker.js
          grep -q 'if(!sameOrigin&&!approvedCdn)return' service-worker.js
          node scripts/check-runtime-contracts.js

      # The complete three-browser suite already runs in parallel in HOY PR Browser QA.
      # Keep this serial release rehearsal available for an explicit manual final check,
      # but do not repeat the same long suite on every pull request.
      - name: Install QA dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm ci --ignore-scripts

      - name: Install release browsers with resilient dependency setup
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PLAYWRIGHT_INSTALL_ATTEMPTS: '2'
          PLAYWRIGHT_INSTALL_TIMEOUT: 10m
        run: bash scripts/install-playwright-browser-resilient.sh chromium webkit

      - name: Start branch server
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hoy-final-http.log 2>&1 &
          echo $! > /tmp/hoy-final-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hoy-final-http.log
          exit 1

      - name: Full Mobile Chrome suite
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx playwright test --project=mobile-chrome --workers=1 --retries=0

      - name: Full Mobile WebKit suite
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx playwright test --project=mobile-webkit --workers=1 --retries=0

      - name: Full Desktop Chromium suite
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx playwright test --project=desktop-chromium --workers=1 --retries=0

      - name: Upload final Playwright report
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-final-release-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload final failure traces
        if: ${{ github.event_name == 'workflow_dispatch' && failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-final-release-failures-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  menu-data-gap-backfill:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 156 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: https://zlscptisdxzxuvllogza.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.HOY_SUPABASE_SECRET_KEY }}
      OPENAI_MENU_REASONING_EFFORT: high
      HOY_MENU_LOCALIZATION_BATCH_SIZE: '40'
      HOY_MENU_LOCALIZATION_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Verify founder-authorized trigger and secrets
        shell: bash
        run: |
          node - <<'NODE'
          const x=require('./.github/hoy-menu-data-gap-trigger.json');
          if(x.production_apply!==true) throw new Error('production_apply must be true');
          if(x.scope!=='menu_structure_and_de_es_en_localization') throw new Error('unexpected scope');
          NODE
          test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY is missing'; exit 2; }
          test -n "$SUPABASE_SECRET_KEY" || { echo '::error::HOY_SUPABASE_SECRET_KEY is missing'; exit 2; }
          node --check scripts/menu-structure-gap-backfill.mjs
          node --check scripts/menu-localization-backfill.mjs
          mkdir -p artifacts

      - name: Close trusted complete zero-item source gaps
        id: structure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/menu-structure-gap-backfill.mjs --apply 2>&1 | tee artifacts/structure.log

      - name: Close DE ES EN localization gaps
        id: localization
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/menu-localization-backfill.mjs --apply 2>&1 | tee artifacts/localization.log

      - name: Upload menu backfill evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-menu-data-gap-backfill-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Report data operation to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          LOCALIZATION_OUTCOME: ${{ steps.localization.outcome }}
        shell: bash
        run: |
          node - <<'NODE' > /tmp/backfill-comment.md
          const fs=require('fs');
          const tail=p=>{try{return fs.readFileSync(p,'utf8').trim().split(/\r?\n/).slice(-30).join('\n')}catch{return '(no log)'}};
          let body=`### HOY Menu Data Gap Backfill\n\nRun **${process.env.GITHUB_RUN_ID}** on PR #156.\n\n- Structure: **${process.env.STRUCTURE_OUTCOME||'unknown'}**\n- DE/ES/EN localization: **${process.env.LOCALIZATION_OUTCOME||'unknown'}**\n\n`;
          body+=`<details><summary>Structure log tail</summary>\n\n\`\`\`text\n${tail('artifacts/structure.log')}\n\`\`\`\n</details>\n\n`;
          body+=`<details><summary>Localization log tail</summary>\n\n\`\`\`text\n${tail('artifacts/localization.log')}\n\`\`\`\n</details>\n\n`;
          body+='This is a Production data operation only; no deploy or merge is implied.';
          process.stdout.write(body);
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/156/comments" -f body="$(cat /tmp/backfill-comment.md)"

      - name: Enforce complete data operation
        if: always()
        env:
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          LOCALIZATION_OUTCOME: ${{ steps.localization.outcome }}
        shell: bash
        run: |
          test "$STRUCTURE_OUTCOME" = success
          test "$LOCALIZATION_OUTCOME" = success
