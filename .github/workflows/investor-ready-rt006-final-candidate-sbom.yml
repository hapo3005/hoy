name: Investor Ready RT-006 Final Candidate SBOM

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/investor-ready-rt006-final-candidate-sbom.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/investor-ready/**'
      - 'docs/investor-ready/third-party-notices.md'
      - 'docs/investor-ready/rt006-ai-asset-register.md'
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYFT_VERSION: '1.51.0'
    steps:
      - name: Checkout exact Core candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: hoy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Lifestyle main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy-lifestyle
          ref: main
          path: hoy-lifestyle
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Works main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hapo3005/hoy-works
          ref: main
          path: hoy-works
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Prove locked Core QA install
        working-directory: hoy
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify immutable Core GitHub Actions
        working-directory: hoy
        run: node scripts/investor-ready/check-github-actions-pins.mjs

      - name: Verify DD notice and AI registers exist
        working-directory: hoy
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/investor-ready/third-party-notices.md
          test -s docs/investor-ready/rt006-ai-asset-register.md
          grep -q '@supabase/supabase-js.*2.111.0' docs/investor-ready/third-party-notices.md
          grep -q 'Leaflet.*1.9.4' docs/investor-ready/third-party-notices.md
          grep -q '@playwright/test.*1.62.0' docs/investor-ready/third-party-notices.md
          grep -q 'store:false' docs/investor-ready/rt006-ai-asset-register.md
          grep -q 'Responses API' docs/investor-ready/rt006-ai-asset-register.md

      - name: Install checksum-verified Syft
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo /tmp/syft-checksums.txt "${base}/syft_${SYFT_VERSION}_checksums.txt"
          curl -fsSLo "/tmp/${archive}" "${base}/${archive}"
          grep " ${archive}$" /tmp/syft-checksums.txt > /tmp/syft-check.txt
          (cd /tmp && sha256sum -c syft-check.txt)
          tar -xzf "/tmp/${archive}" -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft version

      - name: Generate exact release-candidate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p investor-ready-rt006-final
          for repo in hoy hoy-lifestyle hoy-works; do
            mkdir -p "investor-ready-rt006-final/$repo"
            syft "dir:$repo" --source-name "$repo" \
              -o "syft-json=investor-ready-rt006-final/$repo/syft.json" \
              -o "spdx-json=investor-ready-rt006-final/$repo/spdx.json" \
              -o "cyclonedx-json=investor-ready-rt006-final/$repo/cyclonedx.json"
          done

      - name: Run direct dependency census
        shell: bash
        run: |
          set -euo pipefail
          node hoy/scripts/investor-ready/audit-third-party-deps.mjs hoy hoy-lifestyle hoy-works
          cp investor-ready-audit/third-party-dependencies.json investor-ready-rt006-final/
          cp investor-ready-audit/third-party-dependencies.csv investor-ready-rt006-final/
          cp investor-ready-audit/license-files.json investor-ready-rt006-final/

      - name: Fail closed on runtime drift and licence risk
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, re, subprocess

          root=pathlib.Path('investor-ready-rt006-final')
          direct=json.loads((root/'third-party-dependencies.json').read_text())
          records=direct.get('records',[])
          core_pkg=json.loads(pathlib.Path('hoy/package.json').read_text())
          lock=json.loads(pathlib.Path('hoy/package-lock.json').read_text())
          if core_pkg.get('private') is not True:
              raise SystemExit('Core package must remain private:true')
          if lock.get('lockfileVersion') != 3:
              raise SystemExit('Expected npm lockfileVersion 3')

          def exact_runtime(spec):
              if spec.startswith(('npm:','jsr:')):
                  return bool(re.match(r'^(?:npm:|jsr:)(?:@[^/]+/[^@/]+|[^@/]+)@\d+\.\d+\.\d+(?:/|$)',spec))
              if 'cdn.jsdelivr.net/npm/' in spec:
                  tail=spec.split('cdn.jsdelivr.net/npm/',1)[1]
                  return bool(re.match(r'^(?:@[^/]+/[^@/]+|[^@/]+)@\d+\.\d+\.\d+(?:/|$)',tail))
              return True

          runtime=[]; unpinned=[]
          for r in records:
              spec=r.get('spec',''); kind=r.get('kind','')
              is_runtime=kind=='external_import' or (kind=='external_html' and 'cdn.jsdelivr.net/npm/' in spec)
              if is_runtime:
                  runtime.append(r)
                  if not exact_runtime(spec): unpinned.append(r)

          expected_specs={
              'npm:@supabase/supabase-js@2.111.0',
              'jsr:@supabase/functions-js@2.111.0/edge-runtime.d.ts',
              'npm:@supabase/server@1.4.1',
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js',
              'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
              'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css',
          }
          observed={r.get('spec','') for r in runtime}
          missing_expected=sorted(expected_specs-observed)

          package_rows=[]; first_party=[]
          risk_re=re.compile(r'(^|[^A-Z])(A?GPL|LGPL|SSPL|BUSL|BSL|Commons Clause|Elastic License|EUPL|CDDL|MPL|EPL)',re.I)
          for repo in ('hoy','hoy-lifestyle','hoy-works'):
              data=json.loads((root/repo/'syft.json').read_text())
              for a in data.get('artifacts',[]):
                  if a.get('type')=='github-action':
                      continue
                  row={'repository':repo,'name':a.get('name'),'version':a.get('version'),'type':a.get('type'),'licenses':[],'evidence':'syft'}
                  if repo=='hoy' and a.get('type')=='npm' and a.get('name')==core_pkg.get('name') and a.get('version')==core_pkg.get('version'):
                      row['classification']='FIRST_PARTY_PRIVATE_ROOT'; first_party.append(row); continue
                  for item in a.get('licenses') or []:
                      if isinstance(item,str): row['licenses'].append(item)
                      elif isinstance(item,dict): row['licenses'].append(item.get('spdxExpression') or item.get('value') or item.get('license') or '')
                  row['licenses']=[x for x in row['licenses'] if x]
                  package_rows.append(row)

          for key,meta in (lock.get('packages') or {}).items():
              if not key or not key.startswith('node_modules/'):
                  continue
              package_rows.append({
                  'repository':'hoy','name':key[len('node_modules/'):],
                  'version':meta.get('version'),'type':'npm-lock',
                  'licenses':[meta.get('license')] if meta.get('license') else [],
                  'evidence':'package-lock',
              })

          dedup={}
          for row in package_rows:
              k=(row['repository'],row['name'],row['version'],tuple(row['licenses']))
              if k not in dedup: dedup[k]=row
              elif row['evidence'] not in dedup[k]['evidence']: dedup[k]['evidence'] += '+'+row['evidence']
          package_rows=list(dedup.values())
          unknown=[x for x in package_rows if not x['licenses']]
          counsel=[x for x in package_rows if any(risk_re.search(lic) for lic in x['licenses'])]

          # Exact known runtime licences are independently recorded because URL/Edge imports are not npm-installed files.
          known_runtime_licence_baseline={
              '@supabase/supabase-js@2.111.0':'MIT',
              '@supabase/functions-js@2.111.0':'MIT',
              '@supabase/server@1.4.1':'MIT',
              'leaflet@1.9.4':'BSD-2-Clause',
          }

          notices=pathlib.Path('hoy/docs/investor-ready/third-party-notices.md').read_bytes()
          ai=pathlib.Path('hoy/docs/investor-ready/rt006-ai-asset-register.md').read_bytes()
          core_sha=subprocess.check_output(['git','-C','hoy','rev-parse','HEAD'],text=True).strip()
          lifestyle_sha=subprocess.check_output(['git','-C','hoy-lifestyle','rev-parse','HEAD'],text=True).strip()
          works_sha=subprocess.check_output(['git','-C','hoy-works','rev-parse','HEAD'],text=True).strip()
          lock_sha=hashlib.sha256(pathlib.Path('hoy/package-lock.json').read_bytes()).hexdigest()

          status='GREEN' if not unpinned and not unknown and not counsel and not missing_expected else 'REVIEW_REQUIRED'
          summary={
              'schema_version':'2.0',
              'core_sha':core_sha,
              'lifestyle_sha':lifestyle_sha,
              'works_sha':works_sha,
              'package_lock_sha256':lock_sha,
              'third_party_notices_sha256':hashlib.sha256(notices).hexdigest(),
              'ai_asset_register_sha256':hashlib.sha256(ai).hexdigest(),
              'direct_dependency_records':len(records),
              'runtime_dependency_records':len(runtime),
              'unpinned_runtime_records':len(unpinned),
              'first_party_root_records':len(first_party),
              'third_party_package_records':len(package_rows),
              'unknown_third_party_license_records':len(unknown),
              'counsel_review_license_records':len(counsel),
              'missing_expected_runtime_specs':missing_expected,
              'known_runtime_licence_baseline':known_runtime_licence_baseline,
              'status':status,
              'first_party':first_party,
              'unpinned':unpinned,
              'unknown_packages':unknown,
              'counsel_review_packages':counsel,
              'third_party_packages':package_rows,
          }
          (root/'SUMMARY.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          lines=[
              '# HOY RT-006 Final Release Candidate','',
              f'- Core SHA: `{core_sha}`',
              f'- Lifestyle SHA: `{lifestyle_sha}`',
              f'- Works SHA: `{works_sha}`',
              f'- Direct dependency records: {len(records)}',
              f'- Runtime dependency records: {len(runtime)}',
              f'- Unpinned runtime records: {len(unpinned)}',
              f'- Third-party package records: {len(package_rows)}',
              f'- Unknown third-party licence records: {len(unknown)}',
              f'- Counsel-review licence records: {len(counsel)}',
              f'- Missing expected runtime specs: {len(missing_expected)}',
              f'- Status: **{status}**','',
              'No merge to main or Production deploy is performed by this audit.'
          ]
          if unknown:
              lines += ['','## Unknown licences']+[f"- {x['repository']}: {x['name']} {x['version']} ({x['type']})" for x in unknown]
          if counsel:
              lines += ['','## Counsel-review licences']+[f"- {x['repository']}: {x['name']} {x['version']} — {', '.join(x['licenses'])}" for x in counsel]
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          if status!='GREEN': raise SystemExit(1)
          PY

      - name: Upload final RT-006 evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hoy-rt006-final-release-candidate
          path: |
            investor-ready-rt006-final/
            hoy/investor-ready-actions-pin-audit/
          if-no-files-found: error
          retention-days: 90
