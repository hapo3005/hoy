name: RT-007 Read-Only Preflight Gate

on:
  pull_request:
    paths:
      - 'docs/investor-ready/rt007-readonly-preflight-2026-08-19.json'
      - 'docs/investor-ready/rt007-readonly-preflight-2026-08-19.md'
      - 'scripts/investor-ready/check-rt007-readonly-preflight.cjs'
      - '.github/workflows/rt007-readonly-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RT-007 read-only preflight contract
        run: node scripts/investor-ready/check-rt007-readonly-preflight.cjs
