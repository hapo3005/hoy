name: HOY G2 Founding Sales Kit Gate

on:
  pull_request:
    branches:
      - investor-ready/acq05-merchant-confirmation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  founding-sales-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Check G2 Founding Sales contract
        run: node scripts/investor-ready/check-g2-founding-sales-kit.mjs
      - name: Run G2 Founding Sales tests
        run: node --test tests/g2-founding-sales-kit.spec.js
