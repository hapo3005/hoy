name: RT-007 Apply Rollback Candidate Gate

on:
  pull_request:
    paths:
      - 'docs/investor-ready/rt007-apply-rollback-candidate-v1.json'
      - 'docs/investor-ready/rt007-prepared-replacements-v2.json'
      - 'docs/investor-ready/rt007-rollback-before-state-2026-08-19.json'
      - 'scripts/investor-ready/materialize-rt007-apply-rollback-candidate.mjs'
      - 'scripts/investor-ready/check-rt007-apply-rollback-candidate.mjs'
      - '.github/workflows/rt007-apply-rollback-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-guarded-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact guarded Apply and Rollback candidates
        run: node scripts/investor-ready/materialize-rt007-apply-rollback-candidate.mjs .rt007-generated
      - name: Validate exact guarded candidate contract
        run: node scripts/investor-ready/check-rt007-apply-rollback-candidate.mjs .rt007-generated
      - name: Emit immutable candidate digests
        run: sha256sum .rt007-generated/rt007-36-target-apply-candidate.sql .rt007-generated/rt007-36-target-rollback-candidate.sql
